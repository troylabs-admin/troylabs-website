# Checks on every pull request and every push to main. None of them needs a secret or touches the live project:
# texts and emails are sent to fake providers, the database is a throwaway copy built from supabase/migrations, and
# every page test answers the portal's requests with made-up data. So pull requests from forks run all of it too.
#
# Deliberately NOT here: the pixel fidelity suite (font rendering differs on Linux), and the live tests in qa/portal
# that sign in to the real project or call Twilio, LinkedIn or OpenAI. Maintainers run those by hand.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Versions pinned on purpose: every action here runs on Node 24 (GitHub is retiring Node 20), and the runner is
# ubuntu-24.04 rather than ubuntu-latest so the move to Ubuntu 26 happens when we choose, in its own pull request.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10   # a hang fails fast instead of holding up a pull request
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: type-check the edge functions
        run: for f in supabase/functions/*/index.ts; do deno check "$f"; done

  logic:
    name: logic (who gets each message, texts, LinkedIn, dates)
    runs-on: ubuntu-24.04
    timeout-minutes: 10   # a hang fails fast instead of holding up a pull request
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:logic

  pages:
    name: pages (made-up data)
    runs-on: ubuntu-24.04
    timeout-minutes: 20   # a hang fails fast instead of holding up a pull request
    # Playwright's own image: Chromium, WebKit and every system library they need are already inside, so nothing is
    # downloaded from Ubuntu's package mirror (on 2026-10-26 that mirror slowed the install step from ~1 to 15+ minutes).
    # The tag must match @playwright/test in pnpm-lock.yaml; bump both together.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: serve the built site on :4399
        run: |
          pnpm exec astro preview --port 4399 > preview.log 2>&1 &
          for i in $(seq 1 60); do node -e "fetch('http://localhost:4399/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))" && exit 0; sleep 1; done
          cat preview.log; exit 1
      - run: pnpm test:pages
        env: { PORTAL_URL: 'http://localhost:4399' }
      - if: failure()
        uses: actions/upload-artifact@v7
        with: { name: page-test-results, path: test-results/, retention-days: 7 }

  database:
    name: database (permissions, triggers)
    runs-on: ubuntu-24.04
    timeout-minutes: 15   # a hang fails fast instead of holding up a pull request
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v3
        with: { version: latest }
      - name: build a throwaway database from supabase/migrations (+ supabase/seed.sql)
        run: supabase db start
      - name: database tests (pgTAP)
        run: supabase test db
      - run: pnpm test:database
        env: { TL_SUPABASE: local }
